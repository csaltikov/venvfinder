[project]
name = "venvfinder"
version = "0.1.0"
description = "Find and inspect Python virtual environments (uv, venv, virtualenv, conda) on disk — GUI and CLI"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Chad Saltikov", email = "saltikov@ucsc.edu" },
]
requires-python = ">=3.10"
dependencies = []
keywords = ["venv", "virtualenv", "uv", "conda", "environment", "disk-usage", "tkinter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/saltikov/venvfinder"
Repository = "https://github.com/saltikov/venvfinder"
Issues = "https://github.com/saltikov/venvfinder/issues"

[project.scripts]
venvfinder = "venvfinder.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venvfinder"]

[tool.hatch.build.targets.sdist]
include = ["src/venvfinder", "README.md", "LICENSE", "build.sh"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit, conservative rule set: pyflakes, pycodestyle, isort, pyupgrade,
# bugbear, and ruff's own checks. The scanner deliberately swallows errors
# from broken/unreadable environments, so blanket-except style rules are off.
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501"]  # long lines in help strings
